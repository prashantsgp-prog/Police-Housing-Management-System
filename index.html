<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DGP Priority - Housing Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&family=Tiro+Devanagari+Hindi&display=swap');
        
        :root {
            --police-blue: #0a192f;
            --accent-gold: #fbbf24;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: #020617;
            overflow-x: hidden;
        }

        .hindi-font { font-family: 'Tiro Devanagari Hindi', serif; }

        /* न्याय स्टाइल एनिमेटेड बैकग्राउंड */
        .glass-bg {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(30, 58, 138, 0.8));
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .animated-blob {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
            border-radius: 50%;
            z-index: -1;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(20%, 20%); }
        }

        .login-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .input-style {
            background: rgba(15, 23, 42, 0.6) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            transition: all 0.3s ease;
        }

        .input-style:focus {
            border-color: #3b82f6 !important;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .stat-card {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: rgba(59, 130, 246, 0.4);
            background: rgba(30, 41, 59, 0.8);
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }

        /* प्रोग्रेस बार डेकोरेशन */
        .progress-bar {
            height: 6px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #60a5fa);
            box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body>

    <div class="animated-blob" style="top: -10%; left: -10%;"></div>
    <div class="animated-blob" style="bottom: -10%; right: -10%; animation-delay: -5s;"></div>

    <section id="login-page" class="min-h-screen flex items-center justify-center p-6 relative">
        <div class="login-card max-w-[450px] w-full rounded-[30px] p-10 relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-[2px] bg-gradient-to-r from-transparent via-blue-500 to-transparent"></div>
            
            <div class="text-center mb-10">
                <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl bg-blue-600/10 border border-blue-500/20 mb-6">
                    <i class="fa-solid fa-building-shield text-4xl text-blue-500 glow-text"></i>
                </div>
                <h2 class="text-3xl font-bold text-white tracking-tight uppercase">Police Housing</h2>
                <p class="text-blue-400/80 mt-2 font-medium tracking-widest text-xs uppercase">Management System</p>
                <div class="h-[1px] w-12 bg-blue-500/50 mx-auto mt-4"></div>
            </div>

            <form onsubmit="doLogin(event)" class="space-y-6">
                <div>
                    <label class="text-xs font-semibold text-gray-400 ml-1 mb-2 block uppercase tracking-tighter">PNO Number / ID</label>
                    <input type="text" required class="input-style w-full px-5 py-4 rounded-xl text-white outline-none placeholder:text-gray-600" placeholder="Enter Official ID">
                </div>
                <div>
                    <label class="text-xs font-semibold text-gray-400 ml-1 mb-2 block uppercase tracking-tighter">Secure Password</label>
                    <input type="password" required class="input-style w-full px-5 py-4 rounded-xl text-white outline-none placeholder:text-gray-600" placeholder="••••••••">
                </div>
                
                <button type="submit" class="w-full py-4 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-[0_0_20px_rgba(37,99,235,0.3)] transition-all active:scale-[0.98] flex items-center justify-center gap-3 group">
                    LOGIN TO PORTAL
                    <i class="fa-solid fa-arrow-right-long group-hover:translate-x-1 transition-transform"></i>
                </button>
            </form>

            <p class="text-center mt-8 text-gray-500 text-xs">
                <i class="fa-solid fa-lock-shield mr-1"></i> Authorized Personnel Only
            </p>
        </div>
    </section>

    <section id="dashboard-page" class="hidden min-h-screen flex">
        <aside class="w-72 bg-slate-950/50 backdrop-blur-xl border-r border-white/5 flex flex-col">
            <div class="p-8 border-b border-white/5">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-blue-600 rounded-lg flex items-center justify-center">
                        <i class="fa-solid fa-shield-halved text-white"></i>
                    </div>
                    <span class="text-white font-bold text-xl tracking-tighter">DGP-HQ</span>
                </div>
            </div>
            <nav class="flex-1 p-6 space-y-3">
                <a href="#" class="flex items-center gap-4 px-4 py-3 bg-blue-600/10 border border-blue-500/20 text-blue-400 rounded-xl">
                    <i class="fa-solid fa-grid-2"></i> Dashboard
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-500 hover:bg-white/5 rounded-xl transition">
                    <i class="fa-solid fa-building-user"></i> Allotment
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-500 hover:bg-white/5 rounded-xl transition">
                    <i class="fa-solid fa-tools"></i> Maintenance
                </a>
                <a href="#" class="flex items-center gap-4 px-4 py-3 text-gray-500 hover:bg-white/5 rounded-xl transition">
                    <i class="fa-solid fa-map-location-dot"></i> Projects
                </a>
            </nav>
            <div class="p-6">
                <button onclick="location.reload()" class="w-full py-3 bg-red-500/10 hover:bg-red-500/20 text-red-500 border border-red-500/20 rounded-xl transition text-sm font-bold flex items-center justify-center gap-2">
                    <i class="fa-solid fa-power-off"></i> LOGOUT
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <header class="h-20 border-b border-white/5 flex items-center justify-between px-10 sticky top-0 bg-slate-950/80 backdrop-blur-md z-10">
                <div>
                    <h2 class="text-white font-bold text-lg hindi-font">डीजीपी आवास प्रबंधन पोर्टल</h2>
                    <p class="text-gray-500 text-xs uppercase tracking-widest">Main Dashboard / Overview</p>
                </div>
                <div class="flex items-center gap-6">
                    <div class="flex flex-col text-right">
                        <span class="text-white text-sm font-bold">DIG Housing</span>
                        <span class="text-emerald-500 text-[10px] font-bold uppercase">Online</span>
                    </div>
                    <div class="w-10 h-10 rounded-full border-2 border-blue-500 p-0.5">
                        <img src="https://ui-avatars.com/api/?name=Police+Officer&background=0a192f&color=fff" class="rounded-full">
                    </div>
                </div>
            </header>

            <div class="p-10 space-y-10">
                <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
                    <div class="stat-card p-6 rounded-[24px]">
                        <div class="flex items-center justify-between mb-4">
                            <div class="p-3 bg-blue-500/10 text-blue-500 rounded-xl"><i class="fa-solid fa-house"></i></div>
                            <span class="text-emerald-500 bg-emerald-500/10 px-2 py-1 rounded-md text-[10px] font-bold">+5.2%</span>
                        </div>
                        <h3 class="text-gray-400 text-xs font-bold uppercase tracking-tighter">कुल आवास (Total)</h3>
                        <p class="text-2xl font-bold text-white mt-1">12,450</p>
                    </div>
                    <div class="stat-card p-6 rounded-[24px]">
                        <div class="flex
